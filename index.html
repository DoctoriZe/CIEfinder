<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CIEfinder by DoctoriZe</title>
<meta name="description" content="Buscador de códigos CIE-9 y CIE-10 en español e inglés, con historial y favoritos.">
<meta name="theme-color" content="#0D4C77">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CIEfinder">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- Header + buscador -->
  <div class="topbar">
    <img src="icon-192.png" alt="CIEfinder">
    <div class="brand">
      <b>CIEfinder</b>
      <span>by DoctoriZe</span>
    </div>
  </div>

  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por código o nombre (ES/EN)…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" style="display:none;">✕</button>
    </div>
    <div class="filter-row">
      <button class="chip active" data-filter="ALL">Todos</button>
      <button class="chip" data-filter="CIE10">CIE-10</button>
      <button class="chip" data-filter="CIE9">CIE-9</button>
    </div>
  </div>

  <!-- Contenido dinámico -->
  <div class="content" id="content"></div>

  <!-- Bottom nav -->
  <div class="tabbar">
    <button class="tab active" data-view="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Buscar</span>
    </button>
    <button class="tab" data-view="history" style="position:relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Historial</span>
    </button>
    <button class="tab" data-view="favorites">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.35-9.5-8.5C.8 8.1 2.6 4.8 6 4.8c2 0 3.3 1.1 4 2.1a4.9 4.9 0 0 1 4-2.1c3.4 0 5.2 3.3 3.5 6.7C19 15.65 12 20 12 20Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Favoritos</span>
    </button>
  </div>

  <!-- Hoja de detalle -->
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
